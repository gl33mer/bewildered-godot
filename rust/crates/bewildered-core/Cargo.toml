[package]
name = "bewildered-core"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "board_bench"
harness = false

[dependencies]
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.10"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
proptest = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }